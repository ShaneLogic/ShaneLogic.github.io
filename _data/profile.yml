intro: >-
  I study atomic motion, defects, and interfaces in photovoltaic materials,
  connecting first-principles calculations and molecular dynamics with device-scale simulation.
bio: >-
  I am a PhD student in Advanced Materials at HKUST. My research spans finite-temperature
  lattice dynamics, defects and interfaces, and charge transport in photovoltaic materials.
  Alongside these studies, I develop scientific software for interface construction,
  molecular reorientation, and solar-cell modeling.
