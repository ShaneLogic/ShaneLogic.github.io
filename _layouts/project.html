---
layout: default
---
<div class="page-heading"><a class="back-link" href="{{ '/software/' | relative_url }}"><i data-lucide="arrow-left"></i> All software</a><p class="eyebrow">{{ page.category }}</p><h1>{{ page.title }}</h1><p class="page-lead">{{ page.description }}</p><div class="resource-links project-actions"><a class="button-primary" href="{{ page.repository }}" target="_blank" rel="noopener noreferrer"><i data-lucide="code-xml"></i> Repository <i data-lucide="arrow-up-right"></i></a><a href="{{ page.documentation }}" target="_blank" rel="noopener noreferrer">Documentation <i data-lucide="arrow-up-right"></i></a></div></div>
<div class="project-detail-grid"><figure class="research-figure"><button class="image-zoom" type="button" data-image="{{ page.image | relative_url }}" data-caption="{{ page.image_caption | escape }}" aria-label="Enlarge {{ page.title }} image"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}" width="1280" height="960"><span class="zoom-cue"><i data-lucide="expand"></i></span></button><figcaption>{{ page.image_caption }}</figcaption></figure><div class="prose project-prose">{{ content }}<div class="project-facts"><span>Stack</span><strong>{{ page.stack }}</strong><span>Repository</span><a href="{{ page.repository }}" target="_blank" rel="noopener noreferrer">ShaneLogic/{{ page.title }}</a></div></div></div>
